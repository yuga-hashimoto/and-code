name: Release

on:
  push:
    branches: [main]
    paths:
      - '.release-version'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch always runs the workflow definition frozen at the ref it's
          # dispatched against, but a re-run for an existing tag (e.g. backfilling a new
          # release asset for an already-published version) still needs the CURRENT
          # workflow logic - so dispatch from main and let this checkout target the tag
          # instead. github.event.inputs.tag is unset for the push trigger, where the
          # default (this run's own ref) is already correct.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Verify and build APKs
        env:
          AND_CODE_STORE_FILE: ${{ runner.temp }}/release.keystore
          AND_CODE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AND_CODE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AND_CODE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Not itself secret (an OAuth App client ID is meant to be public - it's the value sent
          # in the browser's authorize URL), but named with the AND_CODE_ prefix because GitHub
          # Actions rejects any repo variable/secret starting with GITHUB_. Without this, the app's
          # BuildConfig.GITHUB_CLIENT_ID (app/build.gradle.kts) is baked in empty and every APK this
          # workflow publishes shows "GitHubクライアントIDが含まれていない" with no way to sign in.
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$GITHUB_CLIENT_ID" ]; then
            echo "AND_CODE_GITHUB_CLIENT_ID repo variable is not set - the published APK would have no GitHub sign-in" >&2
            exit 1
          fi
           ./gradlew detekt spotlessCheck :app:lintGithubDebug :app:testGithubDebugUnitTest assembleGithubDebug assembleGithubRelease
          # Separate invocation, deliberately without GITHUB_CLIENT_ID: this is the same flavor and
          # signing config F-Droid's own build server produces (gradleprops: andcode.fdroidBuild=true,
          # no client ID), so this asset is what fdroiddata's Binaries:/AllowedAPKSigningKeys: verify
          # a reproducible build against - it must be built exactly the way F-Droid builds it.
          # GITHUB_CLIENT_ID is set at step level above, so it must be unset here explicitly:
          # otherwise it is baked into BuildConfig and classes.dex no longer matches F-Droid's.
          #
          # The fdroid APK is built the way F-Droid's build server builds it, including the
          # native runtime payload: proot, libtalloc and libandroid-shmem are compiled from
          # the pinned Termux recipes with the NDK here so no prebuilt binary is downloaded.
          # This must match the fdroiddata recipe (srclibs: TermuxPackages@<commit>, ndk: r29).
          bash scripts/build_android_runtime_native_debs.sh --setup --output-dir build/termux-debs
          env -u GITHUB_CLIENT_ID ./gradlew -Pandcode.fdroidBuild=true -Pandcode.sourceNativeLibs=true :app:assembleFdroidRelease

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="$(tr -d '[:space:]' < .release-version)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes
          fi
           cp app/build/outputs/apk/github/debug/app-github-debug.apk "and-code-$TAG-debug.apk"
           ASSETS=("and-code-$TAG-debug.apk")
           if [ -f app/build/outputs/apk/github/release/app-github-release.apk ]; then
             cp app/build/outputs/apk/github/release/app-github-release.apk "and-code-$TAG-release.apk"
             ASSETS+=("and-code-$TAG-release.apk")
             gh release delete-asset "$TAG" "and-code-$TAG-release-unsigned.apk" -y || true
           else
             cp app/build/outputs/apk/github/release/app-github-release-unsigned.apk "and-code-$TAG-release-unsigned.apk"
             ASSETS+=("and-code-$TAG-release-unsigned.apk")
          fi
          # F-Droid's own build server produces this same flavor/signing combination from source
          # (see the "Verify and build APKs" step above); publishing it lets fdroiddata's
          # Binaries:/AllowedAPKSigningKeys: metadata verify a reproducible build against it.
          if [ -f app/build/outputs/apk/fdroid/release/app-fdroid-release.apk ]; then
            cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "and-code-$TAG-fdroid-release.apk"
            ASSETS+=("and-code-$TAG-fdroid-release.apk")
          fi
          gh release upload "$TAG" --clobber "${ASSETS[@]}"
