name: Native runtime source build

# Validates that the Android runtime native payload (proot, libtalloc,
# libandroid-shmem) can be built from the pinned Termux recipes with the NDK and fed into the
# Gradle asset/materialization scripts without any mirror download. This is the path F-Droid
# and the release workflow use; the normal Android CI keeps using the pinned-mirror path.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_android_runtime_native_debs.sh"
      - "scripts/prepare_android_runtime_assets.py"
      - "scripts/prepare_android_runtime_native_libs.py"
      - "runtime_tools/**"
      - "app/build.gradle.kts"
      - ".github/workflows/release.yml"
      - ".github/workflows/native-source-libs.yml"

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Termux native runtime packages from source
        run: bash scripts/build_android_runtime_native_debs.sh --setup --output-dir build/termux-debs

      - name: Materialize native libraries from the source-built packages
        run: |
          python3 scripts/prepare_android_runtime_assets.py \
            --output-dir build/generated/runtime-assets \
            --local-debs-dir build/termux-debs
          python3 scripts/prepare_android_runtime_native_libs.py \
            --linux-assets-dir build/generated/runtime-assets \
            --output-dir build/generated/runtime-jni

      - name: Verify the expected native payload is present
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            echo "== $abi =="
            ls -l "build/generated/runtime-jni/$abi"
            for f in \
              libopencode_android_proot.so \
              libopencode_android_proot_loader.so \
              libopencode_android_proot_loader32.so \
              libtalloc.so \
              libandroid-shmem.so; do
              test -f "build/generated/runtime-jni/$abi/$f" || {
                echo "missing $abi/$f" >&2
                exit 1
              }
            done
          done
