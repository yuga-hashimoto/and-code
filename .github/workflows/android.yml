name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pushes to a pull request cancel their in-flight run; pushes to main always
# finish so the branch keeps a complete history of results.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + spotless)
        run: ./gradlew detekt spotlessCheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Lint
        run: ./gradlew :app:lintDebug

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Validate runtime build scripts
        run: |
          python -m py_compile \
            runtime_tools/termux_assets.py \
            scripts/prepare_android_runtime_assets.py \
            scripts/prepare_android_runtime_native_libs.py
          python scripts/prepare_android_runtime_assets.py --help >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('runtime_tools/termux_assets.lock.json').read_text())
          assert lock['version'] == 1
          assert {'arm64-v8a', 'x86_64'} == set(lock['architectures'])
          assert all(item['packages'] for item in lock['architectures'].values())
          PY

      - name: Test and build debug APK
        # See release.yml for why this is AND_CODE_-prefixed rather than GITHUB_CLIENT_ID directly
        # (GitHub Actions rejects that prefix for repo variables/secrets); without it this job's
        # own debug APK artifact would have no GitHub sign-in either.
        #
        # assembleDebugAndroidTest only compiles the instrumented test sources - there is no
        # emulator/device in this job to actually run them on (connectedDebugAndroidTest), so this
        # is a compile-only safety net: it catches a broken androidTest before merge without the
        # cost of standing up an emulator job.
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      # assembleRelease runs R8 with minification and resource shrinking, which is the single
      # most expensive task in this workflow. The published artifact is built by release.yml,
      # so pull requests only need it to prove the release build still compiles — which main
      # covers on every merge.
      - name: Build release APK
        if: github.event_name == 'push'
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: and-code-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: and-code-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
